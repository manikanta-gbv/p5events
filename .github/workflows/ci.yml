name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails if any image in public/images exceeds the size gate, and if any
      # content file fails its Zod schema.
      - run: npm run build
        env:
          CI: true
      - run: npm run typecheck
